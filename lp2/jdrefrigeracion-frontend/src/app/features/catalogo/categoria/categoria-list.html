<div class="list-container">
  <div class="header-actions">
    <h2>Categorías</h2>
    <a routerLink="nuevo" class="btn-primary">Nueva Categoría</a>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (cat of categorias(); track cat.id) {
        <tr>
          <td>{{ cat.id }}</td>
          <td>{{ cat.nombre }}</td>
          <td>{{ cat.descripcion || '-' }}</td>
          <td class="actions-cell">
            <a [routerLink]="[cat.id]" class="btn-edit">Editar</a>
            <button (click)="eliminar(cat.id)" class="btn-delete">Eliminar</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="text-center">No hay categorías registradas.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
