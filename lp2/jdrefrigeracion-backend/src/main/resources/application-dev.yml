spring:
  application:
    name: jdrefrigeracion-backend
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: JDREFRIG_APP
    password: 123456
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: jd.refrigeracion.dummy@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

cors:
  allowed-origins: "http://localhost:5173,http://localhost:4200"

api:
  documentos:
    base-url: "https://api.apis.net.pe/v2/reniec"
    token: ${API_DOCUMENTOS_TOKEN:TU_TOKEN_AQUI}
